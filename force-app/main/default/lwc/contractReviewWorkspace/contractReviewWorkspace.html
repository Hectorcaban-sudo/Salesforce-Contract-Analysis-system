<template>
    <div class="workspace">
        <template if:true={isRerunning}>
            <div class="wait-overlay">
                <div class="wait-card">
                    <lightning-spinner alternative-text="Analyzing" size="medium"></lightning-spinner>
                    <h2>Analyzing contract</h2>
                    <p>Agentforce is reviewing the document. This can take a minute. Please wait.</p>
                </div>
            </div>
        </template>

        <div class="header">
            <div>
                <h1 class="title">{reviewName}</h1>
                <p class="subtitle">Contract Review Workspace</p>
            </div>
            <div class="header-metrics">
                <div class={overallRiskClass}>
                    <span class="score">{riskScore}/100</span>
                    <span class="label">{overallRiskLabel}</span>
                </div>
                <div class="status-pill">{status}</div>
                <lightning-button label="Re-run Analysis" onclick={handleRerun} variant="neutral" disabled={isRerunning}></lightning-button>
            </div>
        </div>

        <div class="panes">
            <section class="pane document-pane">
                <div class="pane-header">Document Viewer</div>
                <div class="document-body">
                    <template if:true={hasFile}>
                        <div class="doc-actions">
                            <lightning-button label="Open Document" onclick={handleOpenDocument} variant="brand"></lightning-button>
                            <p class="doc-label">Opens the contract in Salesforce preview. Does not download.</p>
                        </div>
                    </template>
                    <template if:true={selectedExcerpt}>
                        <div class="clause-highlight">
                            <div class="clause-highlight-header">
                                <span class="highlight-label">Highlighted clause</span>
                                <span class={selectedBadgeClass}>{selectedClauseType}</span>
                            </div>
                            <p class="highlight-text">{selectedExcerpt}</p>
                            <p class="doc-label">Selected finding. Click another finding to switch.</p>
                        </div>
                    </template>
                    <template if:false={selectedExcerpt}>
                        <p class="empty">No clause selected. Findings appear on the right after analysis.</p>
                    </template>
                </div>
            </section>

            <section class="pane findings-pane">
                <div class="pane-header">AI Findings</div>
                <template if:true={hasFindings}>
                    <template for:each={findings} for:item="finding">
                        <article key={finding.id} class={finding.cardClass} data-id={finding.id} onclick={handleSelectFinding}>
                            <div class="card-header">
                                <h3>{finding.clauseType}</h3>
                                <span class={finding.badgeClass}>{finding.riskLevel}</span>
                            </div>
                            <p class="excerpt">{finding.excerpt}</p>
                            <template if:true={finding.reviewStatus}>
                                <p class="status">Status: {finding.reviewStatus}</p>
                            </template>
                            <template if:true={finding.overrideNote}>
                                <p class="note">Note: {finding.overrideNote}</p>
                            </template>
                            <lightning-textarea
                                label="Override Note"
                                data-id={finding.id}
                                placeholder="Optional note if overriding..."
                                class="slds-m-top_x-small">
                            </lightning-textarea>
                            <div class="actions">
                                <lightning-button label="Accept" data-id={finding.id} onclick={handleAccept} variant="brand"></lightning-button>
                                <lightning-button label="Override" data-id={finding.id} onclick={handleOverride} variant="neutral"></lightning-button>
                            </div>
                        </article>
                    </template>
                </template>
                <template if:false={hasFindings}>
                    <p class="empty">No findings yet. Click Re-run Analysis, then refresh if they do not appear.</p>
                    <template if:true={agentResponse}>
                        <div class="clause-highlight">
                            <p class="highlight-label">Agent response</p>
                            <p class="highlight-text">{agentResponse}</p>
                        </div>
                    </template>
                </template>
                <p class="footer-hint">AI findings are suggestions. Lawyers retain accountability.</p>
            </section>
        </div>
    </div>
</template>
